name: Create Velopack Release

# This workflow runs when a new tag is pushed that starts with 'v'
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-pack:
    # Use the latest Windows runner
    runs-on: windows-latest
    # To allow github to upload the release files
    permissions:
      contents: write

    steps:
      # 1. Check out the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the .NET SDK on the runner
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 3. Automatic tests: a failing test stops here, and nothing is published
      - name: Run tests
        run: dotnet test OlhoNoChat.Testes/OlhoNoChat.Testes.csproj -c Release

      # 4. Build application for release (publish restores the packages itself). Only the app project:
      #    publishing the whole solution would put the test project inside the installer
      - name: Build and publish application
        run: dotnet publish OlhoNoChat/OlhoNoChat.csproj -c Release -o publish -r win-x64 --self-contained true
        
      # 5. Get the version number from the Git tag
      - name: Get version from tag
        id: get-version
        run: |
            $version = "${{ github.ref_name }}".Substring(1)
            echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 6. Download, Pack, and Upload with Velopack
      - name: Create and Upload Velopack Release
        run: |
          dotnet tool install -g vpk --version 1.2.158
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          # Shortcut only in the Start menu (the default also puts one on the Desktop); no portable zip (the app
          # always keeps its settings in %AppData%\OlhoNoChat)
          vpk pack -u OlhoNoChat --packTitle "Olho no Chat" --packAuthors "Hyfronx" -v ${{ steps.get-version.outputs.version }} --packDir publish --mainExe OlhoNoChat.exe --icon OlhoNoChat/olho_no_chat.ico --shortcuts StartMenuRoot --noPortable
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "Olho no Chat v${{ steps.get-version.outputs.version }}" --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
