# Publica uma versão nova do Olho no Chat quando uma tag "vX.Y.Z" chega ao GitHub.
# Enviar só commits para a main não publica nada. O número da versão vem da tag (v2.0.0 -> 2.0.0).
name: Publicar versão

on:
  push:
    tags: ['v*']

jobs:
  publicar:
    runs-on: windows-latest
    permissions:
      contents: write   # criar a release e enviar os arquivos dela
    env:
      VPK_VERSAO: 1.2.161   # sempre a mesma versão do pacote Velopack do app (OlhoNoChat.csproj)

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o SDK do .NET (versão do global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Um teste que falha para tudo aqui, e nada é publicado
      - name: Rodar os testes
        run: dotnet test OlhoNoChat.slnx -c Release

      # Só o projeto do app: a solução inteira levaria o projeto de testes para o instalador
      - name: Compilar o app
        run: dotnet publish OlhoNoChat/OlhoNoChat.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Empacotar e publicar com o Velopack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = '${{ github.ref_name }}'
          $versao = $tag.TrimStart('v')
          $repo = 'https://github.com/${{ github.repository }}'

          dotnet tool install --global vpk --version $env:VPK_VERSAO

          # A última versão publicada serve de base para o pacote delta (a atualização pequena)
          vpk download github --repoUrl $repo --token $env:GITHUB_TOKEN

          # Atalho só no menu Iniciar (sem área de trabalho) e sem o zip portátil: as configurações
          # ficam sempre em %AppData%\OlhoNoChat
          vpk pack --packId OlhoNoChat --packVersion $versao --packTitle 'Olho no Chat' --packAuthors 'Hyfronx' `
            --packDir publish --mainExe OlhoNoChat.exe --icon OlhoNoChat/olho_no_chat.ico `
            --shortcuts StartMenuRoot --noPortable

          vpk upload github --repoUrl $repo --token $env:GITHUB_TOKEN --publish `
            --releaseName "Olho no Chat v$versao" --tag $tag
