name: Create Velopack Release

# This workflow runs when a new tag is pushed that starts with 'v'
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-pack:
    # Use the latest Windows runner
    runs-on: windows-latest
    # To allow github to upload the release files
    permissions:
      contents: write

    steps:
      # 1. Check out the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the .NET SDK on the runner
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 3. Build application for release (publish restores the packages itself)
      - name: Build and publish application
        run: dotnet publish -c Release -o publish -r win-x64 --self-contained true
        
      # 4. Get the version number from the Git tag
      - name: Get version from tag
        id: get-version
        run: |
            $version = "${{ github.ref_name }}".Substring(1)
            echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # 5. Download, Pack, and Upload with Velopack
      - name: Create and Upload Velopack Release
        run: |
          dotnet tool install -g vpk --version 0.0.1298
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          # Shortcut only in the Start menu (the default also puts one on the Desktop)
          vpk pack -u OlhoNoChat --packTitle "Olho no Chat" --packAuthors "Hyfronx" -v ${{ steps.get-version.outputs.version }} --packDir publish --mainExe OlhoNoChat.exe --icon OlhoNoChat/olho_no_chat.ico --shortcuts StartMenuRoot
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "Olho no Chat v${{ steps.get-version.outputs.version }}" --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # vpk 0.0.1298 is built for .NET 9; this lets it run on a newer runtime
          DOTNET_ROLL_FORWARD: Major
