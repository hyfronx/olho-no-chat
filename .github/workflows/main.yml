# Publica uma versão nova do Olho no Chat quando uma tag "vX.Y.Z" chega ao GitHub.
# Enviar só commits para a main não publica nada. O número da versão vem da tag (v2.0.0 -> 2.0.0).
# Uma tag com "-" (v2.10.0-beta.1) é uma versão BETA: sai como pré-lançamento no canal "beta" do Velopack, e só quem
# está na beta (o instalador dela, ou "Receber versões beta" na aba Geral) recebe. O link "latest" continua na normal.
name: Publicar versão

on:
  push:
    tags: ['v*']

jobs:
  publicar:
    runs-on: windows-latest
    permissions:
      contents: write   # criar a release e enviar os arquivos dela
    env:
      VPK_VERSAO: 1.2.161   # sempre a mesma versão do pacote Velopack do app (OlhoNoChat.csproj)

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o SDK do .NET (versão do global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Um teste que falha para tudo aqui, e nada é publicado
      - name: Rodar os testes
        run: dotnet test OlhoNoChat.slnx -c Release

      # Só o projeto do app: a solução inteira levaria o projeto de testes para o instalador
      - name: Compilar o app
        run: dotnet publish OlhoNoChat/OlhoNoChat.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Empacotar e publicar com o Velopack
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = '${{ github.ref_name }}'
          $versao = $tag.TrimStart('v')
          $repo = 'https://github.com/${{ github.repository }}'
          $beta = $versao.Contains('-')
          $canal = if ($beta) { 'beta' } else { 'win' }
          # Uma lista (vazia na normal): passada assim a um programa, cada item vira um argumento. Com "@pre" ou com um
          # "if" que devolve a lista, o PowerShell mandava "--pre" letra por letra
          $pre = @()
          if ($beta) { $pre += '--pre' }

          dotnet tool install --global vpk --version $env:VPK_VERSAO

          # A última versão publicada serve de base para o pacote delta (a atualização pequena)
          # (na beta, a última beta). A primeira de um canal não tem anterior: o pacote sai sem delta
          try {
            vpk download github --repoUrl $repo --token $env:GITHUB_TOKEN --channel $canal $pre
          } catch {
            Write-Host "Sem versão anterior no canal ${canal}: pacote sem delta."
          }

          # Atalho só no menu Iniciar (sem área de trabalho) e sem o zip portátil: as configurações
          # ficam sempre em %AppData%\OlhoNoChat
          vpk pack --packId OlhoNoChat --packVersion $versao --packTitle 'Olho no Chat' --packAuthors 'Hyfronx' `
            --packDir publish --mainExe OlhoNoChat.exe --icon OlhoNoChat/olho_no_chat.ico `
            --shortcuts StartMenuRoot --noPortable --channel $canal

          $nome = if ($beta) { "Olho no Chat v$versao (beta)" } else { "Olho no Chat v$versao" }
          vpk upload github --repoUrl $repo --token $env:GITHUB_TOKEN --publish --channel $canal $pre `
            --releaseName $nome --tag $tag

      # Só ficam as 2 versões normais mais recentes e a beta mais recente (as tags ficam todas). Um problema aqui não
      # desfaz a versão que acabou de sair: só avisa
      - name: Apagar as Releases antigas
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/limpar-releases.ps1 -Repositorio '${{ github.repository }}'
